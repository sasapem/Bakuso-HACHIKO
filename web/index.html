function canvasTex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');draw(g,w,h);const tx=new THREE.CanvasTexture(cv);tx.anisotropy=8;tx.encoding=THREE.sRGBEncoding;return tx}

 g.shadowColor=color;g.shadowBlur=24;g.fillStyle=color;g.fillText(text,w/2,h/2+1);g.shadowBlur=0;g.fillStyle='#fff';g.globalAlpha=.5;g.fillText(text,w/2,h/2+1)}))}

function px(tx){tx.magFilter=THREE.NearestFilter;tx.minFilter=THREE.NearestFilter;tx.generateMipmaps=false;tx.encoding=THREE.sRGBEncoding;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;return tx}
function dots(n,cols){return canvasTex(n,n,(g)=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++){g.fillStyle=pick(cols);g.fillRect(x,y,1,1)}})}
